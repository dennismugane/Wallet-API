# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── Application ─────────────────────────────────────────────────────────────
spring.application.name=muigo-wallet

# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA & Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CRITICAL: We pass SQL execution directly to the logger framework
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway (DB migrations) ───────────────────────────────────────────────────
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Actuator / Observability ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.tracing.sampling.probability=1.0

# ── Logging ──────────────────────────────────────────────────────────────────
# COMMENTED OUT FOR LOCAL DEBUGGING (Forces human-readable console logs)
# logging.structured.format.console=ecs

logging.level.com.muigo.wallet=INFO
logging.level.org.springframework.security=WARN

# Force raw SQL and parameters to stream directly into the local console terminal
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE
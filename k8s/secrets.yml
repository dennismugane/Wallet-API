# k8s/secrets.yml
# IMPORTANT: Never commit real values to git.
# In production, use Sealed Secrets, External Secrets Operator,
# or inject via CI/CD pipeline from a secrets manager (AWS Secrets Manager, Vault).
#
# Replace the placeholder values before applying this manifest.

apiVersion: v1
kind: Secret
metadata:
  name: muigo-wallet-secrets
  namespace: wallet
type: Opaque
stringData:
  db-url: "jdbc:postgresql://YOUR_DB_HOST:5432/wallet_db"
  db-username: "wallet_user"
  db-password: "CHANGE_ME"
  jwt-secret: "CHANGE_ME"
